server:
  port: ${CORE_PORT:8080}

spring:
  application:
    name: karandash-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/karandash}
    username: ${POSTGRES_USER:karandash}
    password: ${POSTGRES_PASSWORD:karandash-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:karandash}
    password: ${RABBITMQ_PASSWORD:karandash-local}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

karandash:
  timezone: Asia/Yekaterinburg
  prototype:
    enabled: ${PROTOTYPE_ENABLED:false}
  notifications:
    budget-warning-ratio: ${BUDGET_WARNING_RATIO:0.90}
  internal-api:
    service-token: ${CORE_SERVICE_TOKEN:}
  access:
    # Кто становится администратором при первом сообщении: без этого выдать права некому.
    admins: ${ADMIN_TELEGRAM_IDS:}
  telegram:
    max-text-length: 2000
    update-retention: 48h
  canteen:
    # Столовая Строительного двора: меню приходит из API-шлюза холдинга.
    enabled: ${CANTEEN_ENABLED:false}
    base-url: ${CANTEEN_BASE_URL:https://api-gateway.prod.hr-holding.itlabs.io}
    # 1 — ЦО в Тюмени. Список столовых — /api/v1/canteen/cafes/
    cafe: ${CANTEEN_CAFE:1}
    token: ${CANTEEN_TOKEN:}
    timeout: 20s
    # Как часто перечитываем меню: столовая дополняет его в течение дня.
    cache: ${CANTEEN_CACHE:10m}
    # По выходным столовая ЦО закрыта: меню не показываем и рассылку не шлём.
    weekends-off: ${CANTEEN_WEEKENDS_OFF:true}
    # Подбор обеда уходит по будням утром.
    cron: ${CANTEEN_CRON:0 0 10 * * MON-FRI}
    zone: ${CANTEEN_ZONE:Europe/Moscow}
  diary:
    # День дневника считается по этому поясу, пока у аккаунта нет своего.
    zone: ${DIARY_ZONE:Asia/Yekaterinburg}
    # Оценка, на которую пользователь не ответил, забывается.
    draft-retention: 24h
  ai:
    # disabled | openai-compatible | agent
    provider: ${AI_PROVIDER:disabled}
    base-url: ${GPT_BASE_URL:https://example.invalid/v1}
    api-key: ${GPT_API_KEY:}
    vision-model: ${GPT_VISION_MODEL:}
    text-model: ${GPT_TEXT_MODEL:}
    agent:
      base-url: ${AGENT_BASE_URL:http://localhost:8095}
      service-token: ${AGENT_SERVICE_TOKEN:}
      connect-timeout: 5s
      read-timeout: ${AGENT_READ_TIMEOUT:150s}
