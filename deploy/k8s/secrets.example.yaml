# ШАБЛОН. В kustomization не входит и значений не содержит.
# Заполнить копию вне git и применить вручную: kubectl apply -f secrets.yaml
# Секреты разделены по сервисам: под на зарубежной ноде получает только свой секрет,
# пароль базы туда не попадает (kubelet ноды видит лишь секреты своих подов).
apiVersion: v1
kind: Secret
metadata:
  name: karandash-db
  namespace: karandash
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  # Строка подключения экспортера метрик: отдельный пользователь с ролью pg_monitor, только чтение статистики.
  # postgresql://karandash_metrics:<пароль>@postgres:5432/karandash?sslmode=disable
  EXPORTER_DSN: ""
---
# Ядро (нода РФ).
apiVersion: v1
kind: Secret
metadata:
  name: karandash-core
  namespace: karandash
type: Opaque
stringData:
  # Номера администраторов бота через запятую: они видят заявки на доступ, выдают его и рассылают «что нового».
  # Свой номер человек узнаёт командой /id. Пока список пуст, заявки рассматривать некому.
  ADMIN_TELEGRAM_IDS: ""
  # Токен доступа к API-шлюзу холдинга: из него берётся меню столовой для утреннего подбора обеда.
  # Живёт до августа 2027; когда протухнет, бот просто перестанет присылать обед.
  CANTEEN_TOKEN: ""
  # Токен, с которым приёмщик ходит во внутренний API ядра. То же значение — в karandash-bot.
  CORE_SERVICE_TOKEN: ""
  # Токен, с которым ядро ходит в агент-адаптер. То же значение — в karandash-agent.
  AGENT_SERVICE_TOKEN: ""
  # Пароль пользователя karandash-core в RabbitMQ Дымохода (vhost karandash).
  RABBITMQ_PASSWORD: ""
---
# Агент-адаптер (зарубежная нода). Нужен ANTHROPIC_API_KEY или CLAUDE_CODE_OAUTH_TOKEN; для продукта — API-ключ.
apiVersion: v1
kind: Secret
metadata:
  name: karandash-agent
  namespace: karandash
type: Opaque
stringData:
  AGENT_SERVICE_TOKEN: ""
  ANTHROPIC_API_KEY: ""
  CLAUDE_CODE_OAUTH_TOKEN: ""
  CODEX_API_KEY: ""
---
# Вход Codex по подписке ChatGPT (зарубежная нода). Нужен только при AGENT_CLI=codex.
# Содержимое — файл ~/.codex/auth.json с машины, где выполнен codex login.
# Внимание: токен обновляется с ротацией, поэтому одну и ту же копию нельзя использовать
# одновременно на личной машине и в кластере — вход в одном из мест перестанет работать.
apiVersion: v1
kind: Secret
metadata:
  name: karandash-codex
  namespace: karandash
type: Opaque
stringData:
  auth.json: ""
---
# Приёмщик Telegram (зарубежная нода).
apiVersion: v1
kind: Secret
metadata:
  name: karandash-bot
  namespace: karandash
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: ""
  CORE_SERVICE_TOKEN: ""
  # Пароль пользователя RabbitMQ karandash-bot (только чтение q.bot.events).
  RABBITMQ_PASSWORD: ""
