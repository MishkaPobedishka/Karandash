# Ядро — нода РФ: единственный сервис с доступом к базе. Внутренний API закрыт сервисным токеном.
apiVersion: v1
kind: Service
metadata:
  name: core
spec:
  selector:
    app: core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      nodeSelector:
        karandash/region: ru
      automountServiceAccountToken: false
      # Kubernetes иначе подставляет в под переменные вида CORE_PORT=tcp://10.43.0.1:8080 для каждого
      # сервиса namespace, и они перебивают ${CORE_PORT:8080} в конфиге приложения.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          image: karandash-core
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/karandash
            - name: POSTGRES_USER
              value: karandash
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: karandash-db
                  key: POSTGRES_PASSWORD
            # Брокер Дымохода, vhost karandash: права пользователя karandash-core — только внутри него.
            - name: RABBITMQ_HOST
              value: rabbitmq.chimney.svc.cluster.local
            - name: RABBITMQ_VHOST
              value: karandash
            - name: RABBITMQ_USER
              value: karandash-core
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: karandash-core
                  key: RABBITMQ_PASSWORD
            - name: CORE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: karandash-core
                  key: CORE_SERVICE_TOKEN
            # Кто становится администратором бота при первом сообщении. Номера через запятую,
            # взять их можно командой /id. Без этого заявки на доступ рассматривать некому.
            - name: ADMIN_TELEGRAM_IDS
              valueFrom:
                secretKeyRef:
                  name: karandash-core
                  key: ADMIN_TELEGRAM_IDS
                  optional: true
            # Кто становится администратором бота при первом сообщении. Номера через запятую,
            # свой номер человек узнаёт командой /id. Без этого заявки на доступ рассматривать некому.
            - name: ADMIN_TELEGRAM_IDS
              valueFrom:
                secretKeyRef:
                  name: karandash-core
                  key: ADMIN_TELEGRAM_IDS
                  optional: true
            # Столовая: меню берётся из API-шлюза холдинга, токен живёт в секрете.
            - name: CANTEEN_ENABLED
              value: "true"
            - name: CANTEEN_CAFE
              value: "1"
            - name: CANTEEN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: karandash-core
                  key: CANTEEN_TOKEN
                  optional: true
            - name: AI_PROVIDER
              value: agent
            - name: AGENT_BASE_URL
              value: http://agent-adapter:8095
            - name: AGENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: karandash-core
                  key: AGENT_SERVICE_TOKEN
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
