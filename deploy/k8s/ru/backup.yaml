# Ночная копия базы Карандаша. Дамп снимается на ноде РФ, шифруется и уезжает в общее S3 кластера
# (MinIO на ноде в Амстердаме, см. deploy/k8s/shared/backups-minio.yaml): падение диска с базой
# больше не уносит копии вместе с ней. За границу уходит только шифротекст — ключ остаётся в РФ.
# Локальная копия тоже остаётся: с ней восстановление быстрее, чем тянуть из S3.
# О каждом запуске CronJob сообщает ядру: из этого получаются метрики, дашборд Backups и алерты.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karandash-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  # 03:30 по Москве: Дымоход снимает свои копии в это же время суток, не мешаем друг другу на одном диске.
  schedule: "30 3 * * *"
  timeZone: Europe/Moscow
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: backup
        spec:
          restartPolicy: Never
          nodeSelector:
            karandash/region: ru
          automountServiceAccountToken: false
          enableServiceLinks: false
          containers:
            - name: backup
              image: karandash-backup
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: karandash-db
                      key: POSTGRES_PASSWORD
                - name: CORE_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: karandash-core
                      key: CORE_SERVICE_TOKEN
                - name: KEEP_DAYS
                  value: "14"
                # Общее хранилище копий кластера. Секрет создаётся при настройке MinIO.
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: karandash-backup-s3
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: karandash-backup-s3
                      key: S3_BUCKET
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: karandash-backup-s3
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: karandash-backup-s3
                      key: S3_SECRET_KEY
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  STARTED=$(date +%s)
                  STAMP=$(date +%Y%m%d_%H%M%S)
                  FILE="/backups/karandash_${STAMP}.dump"
                  STATUS=ok
                  MESSAGE=""

                  echo "==> Ждём базу"
                  until pg_isready -h postgres -p 5432 -q; do sleep 2; done

                  echo "==> Снимаем дамп"
                  if ! pg_dump -h postgres -p 5432 -U karandash karandash --format=custom -f "$FILE"; then
                    STATUS=fail
                    MESSAGE="pg_dump не отработал"
                  fi

                  SIZE=0
                  if [ "$STATUS" = ok ]; then
                    SIZE=$(wc -c < "$FILE")
                    # Пустой или подозрительно маленький дамп — это не копия.
                    if [ "$SIZE" -lt 10240 ]; then
                      STATUS=fail
                      MESSAGE="дамп подозрительно мал: ${SIZE} байт"
                    elif ! pg_restore --list "$FILE" > /dev/null 2>&1; then
                      STATUS=fail
                      MESSAGE="дамп не читается pg_restore"
                    fi
                  fi

                  # За границу уезжает только шифротекст: ключ лежит в секрете на ноде РФ.
                  if [ "$STATUS" = ok ]; then
                    echo "==> Шифруем"
                    if ! openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                           -in "$FILE" -out "${FILE}.enc" -pass file:/keys/encryption_pass; then
                      STATUS=fail
                      MESSAGE="не удалось зашифровать дамп"
                    fi
                  fi

                  if [ "$STATUS" = ok ]; then
                    echo "==> Отправляем в S3"
                    if mc alias set store "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /dev/null \
                       && mc cp "${FILE}.enc" "store/${S3_BUCKET}/karandash_${STAMP}.dump.enc" > /dev/null; then
                      echo "==> Копия в S3: karandash_${STAMP}.dump.enc"
                    else
                      STATUS=fail
                      MESSAGE="копия снята, но не уехала в S3"
                    fi
                  fi
                  rm -f "${FILE}.enc"

                  echo "==> Убираем старые копии на томе"
                  find /backups -name 'karandash_*.dump' -mtime "+${KEEP_DAYS}" -delete || true

                  DURATION=$(( ($(date +%s) - STARTED) * 1000 ))
                  OK=true
                  [ "$STATUS" = ok ] || OK=false
                  echo "==> Итог: ok=${OK}, ${SIZE} байт, ${DURATION} мс ${MESSAGE}"

                  # Отчёт ядру: из него получаются метрики и алерты.
                  wget -q -O - --header="Authorization: Bearer ${CORE_SERVICE_TOKEN}" \
                    --header="Content-Type: application/json" \
                    --post-data="{\"service\":\"karandash\",\"ok\":${OK},\"sizeBytes\":${SIZE},\"durationMs\":${DURATION},\"message\":\"${MESSAGE}\"}" \
                    http://core:8080/internal/backup/report > /dev/null \
                    && echo "==> Отчёт отправлен" || echo "Внимание: отчёт ядру не ушёл"

                  [ "$STATUS" = ok ]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: encryption-key
                  mountPath: /keys
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: karandash-backups
            # Ключ шифрования копий: он остаётся в РФ, за границу уезжает только шифротекст.
            - name: encryption-key
              secret:
                secretName: karandash-backup
                items:
                  - key: encryption_pass
                    path: encryption_pass
                # Джоб работает не от root (образ postgres), поэтому файл ключа читаем всем внутри пода.
                defaultMode: 0444
