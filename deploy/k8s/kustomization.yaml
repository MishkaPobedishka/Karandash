apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Карандаш в k3s Дымохода: ядро и данные — нода РФ, приёмщик Telegram и агент-адаптер — зарубежная нода.
# Секреты в git не хранятся: они создаются вручную по secrets.example.yaml (см. README.md).
namespace: karandash

labels:
  - pairs:
      app.kubernetes.io/part-of: karandash

resources:
  - namespace.yaml
  # Нода РФ: персональные данные и всё, что с ними работает.
  - ru/postgres.yaml
  - ru/core.yaml
  # RabbitMQ свой не ставим: общий брокер Дымохода (namespace chimney), отдельный vhost karandash.
  # Зарубежная нода: сервисы без состояния, без доступа к базе.
  - foreign/agent-adapter.yaml
  - foreign/telegram-bot.yaml

# Сетевые политики — по желанию: в кластере Дымохода k3s/flannel уже неверно обрабатывал deny-all
# (k8s/INFRASTRUCTURE.md, «Известные особенности»). Включать после проверки на кластере.
# components:
#   - components/network-policies

images:
  - name: karandash-core
    newName: localhost:5000/karandash-core
    newTag: latest
  - name: karandash-agent-adapter
    newName: localhost:5000/karandash-agent-adapter
    newTag: latest
  - name: karandash-telegram-bot
    newName: localhost:5000/karandash-telegram-bot
    newTag: latest
