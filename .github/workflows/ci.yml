# Проверка каждой ветки: те же тесты, что я гоняю на pythagoras, и сборка образов.
# Интеграционные тесты идут на Testcontainers, поэтому раннеру нужен Docker — у ubuntu он есть.
name: Сборка и тесты

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Прогон тестов
        run: ./gradlew build --no-daemon --console=plain

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*/build/reports/tests/test"
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Образы
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    strategy:
      matrix:
        service: [core, agent-adapter, telegram-bot, backup]
    steps:
      - uses: actions/checkout@v4

      # Образы никуда не публикуются: реестр живёт в закрытой сети кластера.
      # Здесь важно только то, что Dockerfile собирается — ломается он обычно вместе с правками сборки.
      - name: Сборка образа ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = agent-adapter ]; then
            docker build -f agent-adapter/Dockerfile --build-arg CODEX_VERSION=0.154.0 -t karandash-agent-adapter:ci .
          elif [ "${{ matrix.service }}" = backup ]; then
            docker build -f backup/Dockerfile -t backup-tools:ci .
          else
            docker build -f ${{ matrix.service }}/Dockerfile -t karandash-${{ matrix.service }}:ci .
          fi
